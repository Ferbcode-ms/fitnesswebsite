<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Minimalist training shoe / stopwatch line-art sticker -->
  <g transform="rotate(12 100 100)">
    <!-- Sole -->
    <path d="M40 135 C55 135, 70 137, 100 137 C135 137, 155 132, 165 125 C168 122, 170 128, 168 135 C164 145, 140 148, 100 148 C60 148, 42 144, 38 138 Z" fill="#4A1C21" />
    <!-- Shoe Upper Body -->
    <path d="M40 135 C42 110, 60 90, 85 92 C95 93, 105 105, 120 115 C135 120, 155 120, 165 125 C155 132, 135 137, 100 137 C70 137, 55 135, 40 135 Z" fill="#F7EDE4" stroke="#4A1C21" stroke-width="4" stroke-linejoin="round" />
    <!-- Collar & Tongue -->
    <path d="M85 92 C90 75, 102 70, 112 85 L125 105" stroke="#4A1C21" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Laces -->
    <line x1="98" y1="92" x2="114" y2="99" stroke="#4A1C21" stroke-width="3" stroke-linecap="round" />
    <line x1="105" y1="102" x2="122" y2="108" stroke="#4A1C21" stroke-width="3" stroke-linecap="round" />
    <line x1="112" y1="112" x2="130" y2="117" stroke="#4A1C21" stroke-width="3" stroke-linecap="round" />
    <!-- Swoosh / Accent wave -->
    <path d="M60 122 Q95 118 120 128" stroke="#4A1C21" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <!-- Accent twinkle -->
  <path d="M45 45 L48 55 L58 58 L48 61 L45 71 L42 61 L32 58 L42 55 Z" fill="#4A1C21" />
</svg>

