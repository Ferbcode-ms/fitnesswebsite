<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Strength plate / resistance band loop sticker -->
  <g transform="rotate(-15 100 100)">
    <!-- Outer rim plate -->
    <circle cx="100" cy="100" r="70" fill="#E9C9CF" stroke="#4A1C21" stroke-width="5" />
    <circle cx="100" cy="100" r="54" fill="#F7EDE4" stroke="#4A1C21" stroke-width="3" />
    <!-- Center hole -->
    <circle cx="100" cy="100" r="18" fill="#4A1C21" />
    <circle cx="100" cy="100" r="10" fill="#E9C9CF" />
    <!-- Weight text or cutouts -->
    <text x="100" y="65" text-anchor="middle" fill="#4A1C21" font-family="sans-serif" font-weight="900" font-size="14">STRENGTH</text>
    <text x="100" y="148" text-anchor="middle" fill="#4A1C21" font-family="sans-serif" font-weight="900" font-size="14">WOMEN</text>
    <!-- Grip openings -->
    <path d="M42 95 Q40 105 42 115" stroke="#4A1C21" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M158 95 Q160 105 158 115" stroke="#4A1C21" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
  <!-- Sparkle -->
  <path d="M165 145 L168 153 L176 155 L168 157 L165 165 L162 157 L154 155 L162 153 Z" fill="#4A1C21" />
</svg>

